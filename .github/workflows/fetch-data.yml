name: Fetch market data

on:
  schedule:
    # 18:30 UTC = 00:00 IST. GitHub runs cron in UTC only.
    # Mon-Sat: Saturday's run picks up Friday's close; NSE is shut Sun/Mon-morning.
    - cron: '30 18 * * 1-6'
  workflow_dispatch: {}

# The job pushes back to the default branch, so it needs write access.
permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_data.py

      # fetch_data.py swallows per-ticker failures, so an empty or truncated
      # file would otherwise be committed as if it were fine.
      - name: Sanity-check the output
        run: |
          for f in public/data/*.json; do
            rows=$(python -c "import json,sys; print(len(json.load(open('$f'))))")
            echo "$f -> $rows rows"
            [ "$rows" -gt 1000 ] || { echo "::error::$f has only $rows rows"; exit 1; }
          done

      - name: Commit if the data changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git diff --cached --quiet && { echo 'No change — market was shut.'; exit 0; }
          git commit -m 'chore: refresh market data [skip ci]'
          git push
